<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Adrián Pulido Párraga">
  <meta name="description" content="Formulario para escribir una reseña de un plato de Delicias Pulido">
  <meta name="keywords" content="reseña, platos, restaurante, Delicias Pulido, formulario">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="fotos/deliciaspulido.png">
  <link rel="stylesheet" href="../css/styles.css">
  <title>Reseña de un plato - Delicias Pulido</title>
</head>
<body class="pagina-restaurante">
  <header class="cabecera cabecera-restaurante">
    <h1>Escribe una reseña de un plato</h1>
    <p>Delicias Pulido</p>
  </header>
  <nav class="navegacion navegacion-restaurante" aria-label="Navegación">
    <a href="index.html">Volver al menú principal del restaurante</a>
    <span aria-hidden="true"> | </span>
    <a href="../index.html">Volver al inicio</a>
  </nav>
  <main class="contenido contenido-restaurante">
    <form>
      <fieldset>
        <legend>Tu reseña</legend>
        <div class="campo">
          <label for="plato">Plato que quieres reseñar</label>
          <select id="plato" name="plato" required>
            <option value="">Selecciona un plato</option>
            <option value="chuletas">Chuletas de ternera</option>
            <option value="tortilla">Tortilla de patatas</option>
            <option value="gambones">Gambones</option>
          </select>
        </div>
        <div class="campo">
          <label for="nombre">Nombre de quien realiza la reseña</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required>
        </div>
        <div class="campo">
          <label for="resena">Reseña del plato</label>
          <textarea id="resena" name="resena" required></textarea>
        </div>
      </fieldset>
      <div class="acciones"><button type="submit">Enviar reseña</button></div>
    </form>
  </main>
  <footer class="pie pie-restaurante"><p>Delicias Pulido</p></footer>
</body>
</html>
