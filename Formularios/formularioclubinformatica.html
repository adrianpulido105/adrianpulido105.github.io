<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Adrián Pulido Párraga">
  <meta name="description" content="Cuestionario para formar parte del club Amigos de la informática">
  <meta name="keywords" content="formulario, club, informática, Amigos de la informática">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario del club de informática</title>
</head>
<body>
  <header>
    <h1>Rellena el siguiente cuestionario para formar parte del club de<br>«Amigos de la informática»</h1>
  </header>

  <nav aria-label="Navegación">
    <a href="../index.html">Volver al inicio</a>
  </nav>

  <main>
    <form>
      <fieldset>
        <legend>Datos personales</legend>
        <div class="datos-personales">
          <label for="nombre">Nombre:</label>
          <input class="campo" id="nombre" name="nombre" type="text" autocomplete="name">

          <label for="domicilio">Domicilio:</label>
          <input class="campo" id="domicilio" name="domicilio" type="text" placeholder="Calle, número y localidad" autocomplete="street-address">

          <label for="pais">País de origen:</label>
          <select class="campo" id="pais" name="pais">
            <option selected>España</option>
            <option>Argentina</option>
            <option>Colombia</option>
            <option>Francia</option>
            <option>México</option>
            <option>Perú</option>
            <option>Otro</option>
          </select>

          <label for="fecha-nacimiento">Fecha de nacimiento:</label>
          <input class="campo" id="fecha-nacimiento" name="fecha-nacimiento" type="date">

          <label for="correo">Correo electrónico:</label>
          <input class="campo" id="correo" name="correo" type="email" autocomplete="email">

          <label for="telefono">Teléfono:</label>
          <input class="campo" id="telefono" name="telefono" type="tel" autocomplete="tel">

          <span>Estado civil:</span>
          <div class="opciones-en-linea">
            <label><input type="radio" name="estado-civil" value="soltero"> Soltero/a</label>
            <label><input type="radio" name="estado-civil" value="casado"> Casado/a</label>
            <label><input type="radio" name="estado-civil" value="separado"> Separado/a</label>
            <label><input type="radio" name="estado-civil" value="viudo"> Viudo/a</label>
          </div>

          <span>Sexo:</span>
          <div class="opciones-en-linea">
            <label><input type="radio" name="sexo" value="hombre"> Hombre</label>
            <label><input type="radio" name="sexo" value="mujer"> Mujer</label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Otra información de interés</legend>
        <div class="informacion-interes">
          <div>
            <label for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabaja:</label>
            <select class="componentes" id="componentes" name="componentes" multiple size="4">
              <option>Móvil</option>
              <option>Tablet</option>
              <option>Ordenador</option>
              <option>Ebook</option>
            </select>
          </div>

          <div>
            <p>Seleccione tus actividades favoritas:</p>
            <div class="actividades">
              <label><input type="checkbox" name="actividades" value="deporte"> Hacer deporte</label>
              <label><input type="checkbox" name="actividades" value="amigos"> Salir con mis amigos</label>
              <label><input type="checkbox" name="actividades" value="series"> Ver series, pelis...</label>
              <label><input type="checkbox" name="actividades" value="senderismo"> Realizar rutas de senderismo</label>
              <label><input type="checkbox" name="actividades" value="cine"> Ir al cine</label>
              <label><input type="checkbox" name="actividades" value="musica"> Escuchar música</label>
            </div>
          </div>

          <div class="motivo">
            <label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label>
            <textarea id="motivo" name="motivo"></textarea>
          </div>

          <div class="pelicula">
            <label for="pelicula">Elige o escribe tu película favorita:</label>
            <input id="pelicula" name="pelicula" type="text">
          </div>
        </div>
      </fieldset>

      <div class="acciones">
        <button type="submit">Enviar</button>
        <button type="reset">Cancelar</button>
      </div>
    </form>
  </main>
  <footer>
    <p><a href="index.html">Volver al índice de formularios</a></p>
  </footer>
</body>
</html>
